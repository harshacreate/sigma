title: AWS Failed Console Login Followed by Key Creation
id: 4def67ca-096c-4c2a-aaf7-d2b19470f150
name: aws_cloudtrail_failed_login_then_key_creation
status: experimental
description: Detects a failed AWS console login followed by API key creation for another IAM user from the same source IP within thirty minutes.
references:
    - https://github.com/SigmaHQ/sigma/blob/d7c9da10c170a6988d68ebdf2c9f7bd8782b7c55/rules/cloud/aws/cloudtrail/aws_cloudtrail_console_login_failed_authentication.yml
    - https://github.com/SigmaHQ/sigma/blob/d7c9da10c170a6988d68ebdf2c9f7bd8782b7c55/rules/cloud/aws/cloudtrail/aws_iam_backdoor_users_keys.yml
author: Harsha Malepati (harshacreate)
date: 2026-11-11
tags:
    - attack.credential-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1098
correlation:
    type: temporal_ordered
    rules:
        - 6393e346-1977-46ef-8987-ad414a145fad
        - 0a5177f4-6ca9-44c2-aacf-d3f3d8b6e4d2
    group-by:
        - sourceIPAddress
    timespan: 30m
    generate: true
falsepositives:
    - Shared NAT or proxy addresses may join an unrelated login failure with authorized key provisioning.
    - Administrators may provision keys after a user reports account access problems.
level: high
